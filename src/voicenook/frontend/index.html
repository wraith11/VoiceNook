<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceNook</title>
<style>
  :root{--bg:#0f1218;--panel:#171c26;--panel2:#1d2431;--line:#2a3242;--txt:#e6ebf3;--mut:#9aa6b8;--acc:#4f8cff;--ok:#3fce7c;--err:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  .wrap{max-width:980px;margin:0 auto;padding:1.2rem}
  h1{font-size:1.3rem;margin:.2rem 0 1rem}
  h3{font-size:.95rem;margin:0 0 .4rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
  label{display:block;font-size:.8rem;color:var(--mut);margin:.6rem 0 .25rem}
  textarea{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:.55rem;font-size:.95rem;resize:vertical}
  textarea:disabled{opacity:.4}
  input[type=text],input[type=number],select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:.55rem;font-size:.95rem}
  input[type=file]{color:var(--mut);font-size:.85rem}
  .row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
  .row>.g{flex:1;min-width:200px}
  .row>.g input[type=text],.row>.g input[type=number],.row>.g select{width:100%}
  .btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:.55rem 1rem;font-size:.95rem;cursor:pointer}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sec{background:var(--panel2);border:1px solid var(--line)}
  .btn.danger{background:var(--err)}
  .btn.ok{background:var(--ok);color:#0b1210}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:.1rem .45rem;font-size:.72rem;margin:.15rem .1rem;color:var(--mut)}
  .hibadge{display:inline-flex;align-items:center;gap:.3rem;color:var(--err);font-size:.72rem;cursor:default}
  .hibadge .xcircle{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--err);color:var(--err);font-size:.65rem;line-height:1}
  .libdesc{flex:1;min-width:140px}
  /* Reftext-Button ohne Rahmen; Klick blendet Reftext in eigener Zeile ein */
  .refrow{margin:.3rem 0}
  .refbtn{background:none;border:none;color:var(--acc);cursor:pointer;font-size:.75rem;padding:0;text-decoration:underline;text-underline-offset:2px}
  .refrow .reftxt{display:none;margin-top:.35rem;padding:.45rem .6rem;background:var(--panel2);border:1px solid var(--line);border-radius:6px;font-size:.78rem;color:var(--txt);white-space:normal}
  .refrow .reftxt.open{display:block}
  #status{margin:.6rem 0;font-size:.88rem;min-height:1.2em}
  .voice{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.5rem .4rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .voice:last-child{border-bottom:none}
  .voice .meta{font-size:.78rem;color:var(--mut)}
  .prog{display:none;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:.5rem}
  .prog>div{height:100%;width:0;background:var(--acc)}
  /* Springende Punkte (in-progress) */
  .dots{display:none;gap:4px;align-items:center;margin-left:.4rem}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:dotb 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}
  .dots i:nth-child(3){animation-delay:.4s}
  .dots.dots-on{display:inline-flex}
  @keyframes dotb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
  .tabs{display:flex;gap:.4rem;margin-bottom:1rem;border-bottom:1px solid var(--line)}
  .tab{background:var(--panel2);border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:.55rem 1.2rem;cursor:pointer;color:var(--mut);font-size:.95rem}
  .tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
  .pane{display:none}
  .pane.active{display:block}
  .tags{display:flex;flex-wrap:wrap;gap:.25rem;margin:.4rem 0}
  .tags .cat{width:100%;font-size:.72rem;color:var(--mut);margin-top:.3rem}
  .tags button{background:var(--panel2);color:#cfe0ff;border:1px solid var(--line);border-radius:6px;padding:.25rem .5rem;cursor:pointer;font-size:.72rem}
  .tags button:hover{background:#3a4670}
  details>summary{color:var(--mut);font-size:.8rem;cursor:pointer}
  /* Generate & play / Generate only Split-Button */
  .split{display:inline-flex;align-items:stretch;border-radius:8px;overflow:hidden}
  .split .main{background:var(--acc);color:#fff;border:none;padding:.55rem 1rem;font-size:.95rem;cursor:pointer}
  .split .caret{background:var(--acc);color:#fff;border:none;border-left:1px solid rgba(255,255,255,.35);padding:0 .5rem;cursor:pointer;font-size:.8rem}
  .split select{display:none}
  .dropmenu{position:absolute;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:.25rem;z-index:50;min-width:150px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
  .dropmenu button{display:block;width:100%;background:none;border:none;color:var(--txt);text-align:left;padding:.4rem .6rem;border-radius:6px;cursor:pointer;font-size:.85rem}
  .dropmenu button:hover{background:var(--panel)}
  .dropmenu button.on{color:var(--ok)}
  .wrap{position:relative}
  /* Higgs-Status */
  .hstatus{display:inline-flex;align-items:center;gap:.5rem;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:.35rem .7rem;font-size:.8rem;color:var(--mut);cursor:pointer;user-select:none}
  .hstatus:hover{border-color:var(--acc)}
  .hstatus .dot{width:10px;height:10px;border-radius:50%;background:var(--warn,#e0a93a)}
  .hstatus.on .dot{background:var(--ok)}
  .hstatus .spin{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:spin 1s linear infinite;display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ VoiceNook</h1>
  <div class="tabs" id="tabs">
    <button class="tab active" id="tabVox" data-i18n="tab_vox">VoxCPM2</button>
    <button class="tab" id="tabHiggs" data-i18n="tab_higgs">Higgs v3</button>
    <button class="tab" id="tabLib" data-i18n="tab_lib">Stimmen-Bibliothek</button>
  </div>
  <div id="status"></div>

  <!-- ============ VOXCPM2 ============ -->
  <div class="pane active" id="paneVox">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <label data-i18n="mode" style="margin:0">Modus</label>
        <span class="hstatus" id="voxStatus"><span class="dot" id="voxDot"></span><span id="voxStatusTxt">VoxCPM2</span></span>
      </div>
      <select id="voxMode">
        <option value="design" data-i18n="mode_design">Voice Design (nur Beschreibung)</option>
        <option value="ref" data-i18n="mode_ref">Clone (Reference + Beschreibung)</option>
        <option value="high" data-i18n="mode_high">Clone (High similarity, ohne Beschreibung)</option>
      </select>
      <label data-i18n="desc">Stimmbeschreibung (Englisch)</label>
      <textarea id="desc" rows="2" placeholder="A warm, calm male voice, slightly smiling, medium pace"></textarea>
      <div id="voiceRow" style="display:none"><label data-i18n="voice">Stimme</label><select id="voiceSel"></select></div>
      <label data-i18n="text">Text</label>
      <textarea id="text" rows="3" placeholder="Hallo und herzlich willkommen!"></textarea>
      <details style="margin-top:.6rem">
        <summary data-i18n="advanced">Erweitert</summary>
        <div class="row" style="margin-top:.4rem">
          <div class="g"><label>cfg_value</label><input type="number" id="cfg" step="0.1"></div>
          <div class="g"><label data-i18n="timesteps">inference_timesteps</label><input type="number" id="steps"></div>
          <div class="g"><label data-i18n="seed">Seed (leer = zufällig)</label><input type="text" id="seed" placeholder=""></div>
        </div>
      </details>
      <div class="row" style="margin-top:.8rem">
        <span class="split">
          <button class="main" id="genBtn" data-i18n="gen_play">Generate &amp; play</button>
          <button class="caret" id="genCaret">▾</button>
          <div class="dropmenu" id="genMenu" style="display:none">
            <button data-i18n="gen_play_opt" id="optPlay">Generate &amp; play</button>
            <button data-i18n="gen_only_opt" id="optOnly">Generate only</button>
          </div>
        </span>
        <button class="btn sec" id="stopBtn" data-i18n="stop">Stopp</button>
        <span class="dots" id="voxDots"><i></i><i></i><i></i></span>
      </div>
    </div>
    <div class="card">
      <label data-i18n="result">Ergebnis</label>
      <audio id="voxPlayer" controls style="width:100%"></audio>
      <div class="row" style="margin-top:.6rem">
        <select id="voxFmt" style="flex:0 0 150px">
          <option value="wav">WAV</option>
          <option value="mp3">MP3</option>
          <option value="flac">FLAC</option>
          <option value="opus">OPUS</option>
          <option value="ogg">OGG</option>
          <option value="aac">AAC</option>
        </select>
        <button class="btn sec" id="voxDl" disabled data-i18n="download">Download</button>
        <button class="btn ok" id="saveGenBtn" disabled data-i18n="save_voice">Als Stimme speichern</button>
      </div>
    </div>
    <div id="voxResultMsg" style="font-size:.85rem;min-height:1.2em;margin:.2rem 0 .8rem"></div>
  </div>

  <!-- ============ HIGGS ============ -->
  <div class="pane" id="paneHiggs">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <label data-i18n="voice" style="margin:0">Stimme</label>
        <span class="hstatus" id="hgStatus"><span class="dot" id="hgDot"></span><span id="hgStatusTxt" data-i18n="hg_idle">Higgs inaktiv</span></span>
      </div>
      <select id="hgVoice"></select>
      <label data-i18n="ctrltokens">Steuertokens</label>
      <div class="tags" id="hgTags"></div>
      <label data-i18n="text">Text</label>
      <textarea id="hgText" rows="8" placeholder="Text, der vorgelesen werden soll"></textarea>
      <details style="margin-top:.6rem">
        <summary data-i18n="advanced">Erweitert</summary>
        <div class="row" style="margin-top:.4rem">
          <div class="g"><label>temperature</label><input type="number" id="hgTemp" value="0.8" step="0.05"></div>
          <div class="g"><label data-i18n="seam">seam</label><input type="number" id="hgSeam" value="0.25" step="0.05"></div>
          <div class="g"><label data-i18n="seed">Seed</label><input type="text" id="hgSeed" placeholder="0"></div>
        </div>
      </details>
      <div class="row" style="margin-top:.8rem">
        <span class="split">
          <button class="main" id="hgGenBtn" data-i18n="gen_play">Generate &amp; play</button>
          <button class="caret" id="hgGenCaret">▾</button>
          <div class="dropmenu" id="hgGenMenu" style="display:none">
            <button id="hgOptPlay">Generate &amp; play</button>
            <button id="hgOptOnly">Generate only</button>
          </div>
        </span>
        <button class="btn sec" id="hgStopBtn" data-i18n="stop">Stopp</button>
        <span class="dots" id="hgDots"><i></i><i></i><i></i></span>
      </div>
    </div>
    <div class="card">
      <label data-i18n="result">Ergebnis</label>
      <audio id="hgPlayer" controls style="width:100%"></audio>
      <div class="row" style="margin-top:.6rem">
        <select id="hgFmt" style="flex:0 0 150px">
          <option value="wav">WAV</option>
          <option value="mp3">MP3</option>
          <option value="flac">FLAC</option>
        </select>
        <button class="btn sec" id="hgDl" disabled data-i18n="download">Download</button>
      </div>
    </div>
    <div id="hgResultMsg" style="font-size:.85rem;min-height:1.2em;margin:.2rem 0 .8rem"></div>
  </div>

  <!-- ============ STIMMEN-BIBLIOTHEK ============ -->
  <div class="pane" id="paneLib">
    <div class="card">
      <h3 data-i18n="create_voice">Stimme erstellen</h3>
      <div class="row"><div class="g"><label data-i18n="name">Name</label><input type="text" id="libName" placeholder="z.B. meine_stimme"></div></div>
      <label data-i18n="reftext">Referenz-Text</label>
      <textarea id="libReftext" rows="3" placeholder="Transkript der Aufnahme"></textarea>
      <div class="row" style="margin-top:.6rem"><div class="g"><label data-i18n="audiofile">Audiodatei (mp3/wav/flac…)</label><input type="file" id="libFile" accept="audio/*"></div></div>
      <div class="row" style="margin-top:.6rem"><button class="btn ok" id="libCreateBtn" data-i18n="create_voice">Stimme erstellen</button></div>
    </div>
    <div class="card">
      <h3 data-i18n="existing">Vorhandene Stimmen</h3>
      <label data-i18n="testsentence">Testsatz für die Vorschau</label>
      <input type="text" id="testSentence" style="width:100%" value="Hallo, das ist ein Test meiner Stimme.">
      <div id="libList" style="margin-top:.4rem"><p class="hint">Lade…</p></div>
    </div>
    <div id="libMsg" style="font-size:.85rem;min-height:1.2em;margin:.2rem 0 .8rem"></div>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
let HIGGS_URL="/higgs";
let CFG={lang:"de",cfg_default:2.0,steps_default:20,higgs_enabled:true,higgs_url:HIGGS_URL};
let genMode="play";   // "play" = Generate & play, "only" = Generate only
let abortCtrl=null;
let ctx=null, nextT=0;
let vox={parts:[],rate:48000,wav:null,cachedText:""};
let hg={parts:[],rate:24000,wav:null};

/* ---------- i18n ---------- */
const T={
  de:{tab_vox:"VoxCPM2",tab_higgs:"Higgs v3",tab_lib:"Stimmen-Bibliothek",mode:"Modus",
    mode_design:"Voice Design (nur Beschreibung)",mode_ref:"Clone (Reference + Beschreibung)",
    mode_high:"Clone (High similarity, ohne Beschreibung)",desc:"Stimmbeschreibung (Englisch)",
    voice:"Stimme",text:"Text",advanced:"Erweitert",timesteps:"inference_timesteps",
    seed:"Seed (leer = zufällig)",gen_play:"Generate & play",gen_play_opt:"Generate & play",
    gen_only_opt:"Generate only",stop:"Stopp",result:"Ergebnis",download:"Download",
    save_voice:"Als Stimme speichern",ctrltokens:"Steuertokens",seam:"seam",
    create_voice:"Stimme erstellen",name:"Name",reftext:"Referenz-Text",
    audiofile:"Audiodatei (mp3/wav/flac…)",existing:"Vorhandene Stimmen",testsentence:"Testsatz für die Vorschau",
    hg_idle:"Higgs inaktiv",hg_loading:"Higgs lädt…",hg_active:"Higgs aktiv",hg_start:"Higgs starten",
    hg_stop:"Higgs stoppen",hg_disabled:"Higgs deaktiviert",gen_ttfb:"TTFB {ms} ms",
    gen_done:"Fertig — {s} s. TTFB {ms} ms.",gen_only_done:"Fertig — {s} s. Zum Abspielen Play drücken.",
    error:"Fehler: {msg}",saved:"Stimme '{name}' gespeichert ({mode})",deleted:"Stimme '{name}' gelöscht.",
    created:"Stimme '{name}' erstellt ({mode})",choose_voice:"Bitte eine Stimme wählen.",enter_text:"Bitte Text eingeben.",
    no_audio:"Kein Audio erzeugt.",aborted:"Abgebrochen.",name_req:"Name angeben.",test_play:"Test abgespielt.",
    testing:"Teste Stimme '{name}'…",dl_start:"Download gestartet.",download_err:"Fehler Download: {msg}",
    higgs_down:"Higgs-Server nicht erreichbar. Klick auf den Status startet ihn.",
    higgs_auto:"Higgs wurde automatisch gestartet. Der erste Lauf lädt das Modell und dauert etwas.",
    mdl_loaded_vox:"VoxCPM2 geladen",mdl_idle_vox:"VoxCPM2 standby",
    mdl_loaded_higgs:"Higgs v3 geladen",mdl_idle_higgs:"Higgs v3 standby",
    load:"Laden",unload:"Entladen",desc_hint:"Beschreibung (optional)",desc_saved:"Beschreibung für '{name}' gespeichert."},
  en:{tab_vox:"VoxCPM2",tab_higgs:"Higgs v3",tab_lib:"Voice Library",mode:"Mode",
    mode_design:"Voice Design (description only)",mode_ref:"Clone (Reference + description)",
    mode_high:"Clone (High similarity, no description)",desc:"Voice description (English)",
    voice:"Voice",text:"Text",advanced:"Advanced",timesteps:"inference_timesteps",
    seed:"Seed (empty = random)",gen_play:"Generate & play",gen_play_opt:"Generate & play",
    gen_only_opt:"Generate only",stop:"Stop",result:"Result",download:"Download",
    save_voice:"Save as voice",ctrltokens:"Control tokens",seam:"seam",
    create_voice:"Create voice",name:"Name",reftext:"Reference text",
    audiofile:"Audio file (mp3/wav/flac…)",existing:"Existing voices",testsentence:"Test sentence for preview",
    hg_idle:"Higgs inactive",hg_loading:"Higgs loading…",hg_active:"Higgs active",hg_start:"Start Higgs",
    hg_stop:"Stop Higgs",hg_disabled:"Higgs disabled",gen_ttfb:"TTFB {ms} ms",
    gen_done:"Done — {s} s. TTFB {ms} ms.",gen_only_done:"Done — {s} s. Press play to listen.",
    error:"Error: {msg}",saved:"Voice '{name}' saved ({mode})",deleted:"Voice '{name}' deleted.",
    created:"Voice '{name}' created ({mode})",choose_voice:"Please choose a voice.",enter_text:"Please enter text.",
    no_audio:"No audio produced.",aborted:"Aborted.",name_req:"Please provide a name.",test_play:"Test played.",
    testing:"Testing voice '{name}'…",dl_start:"Download started.",download_err:"Download error: {msg}",
    higgs_down:"Higgs server unreachable. Click the status to start it.",
    higgs_auto:"Higgs started automatically. The first run loads the model and takes a moment.",
    mdl_loaded_vox:"VoxCPM2 loaded",mdl_idle_vox:"VoxCPM2 standby",
    mdl_loaded_higgs:"Higgs v3 loaded",mdl_idle_higgs:"Higgs v3 standby",
    load:"Load",unload:"Unload",desc_hint:"Description (optional)",desc_saved:"Description saved for '{name}'."}
};
function tr(key,params){
  let s=(T[CFG.lang]||T.de)[key]||key;
  if(params) for(const k in params) s=s.replace("{"+k+"}",params[k]);
  return s;
}
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.getAttribute("data-i18n");
    if(k) el.textContent=tr(k);
  });
  document.title=CFG.lang==="en"?"VoiceNook":"VoiceNook";
  document.documentElement.lang=CFG.lang;
}

/* ---------- Status ---------- */
function status(msg,ok=true){ $("status").textContent=msg; $("status").style.color=ok?"var(--txt)":"var(--err)"; }
// Status unter dem Ergebnis-Bereich
function rstatus(id,msg,ok=true){ const el=$(id); if(!el)return; el.textContent=msg; el.style.color=ok?"var(--txt)":"var(--err)"; }
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- In-Progress-Dots (3 springende Punkte) ---------- */
let dotTimers=[];
function showDots(container){
  stopDots();
  const el=$(container); if(!el)return;
  el.classList.add("dots-on");
}
function stopDots(){
  document.querySelectorAll(".dots-on").forEach(e=>e.classList.remove("dots-on"));
}

/* ---------- Tabs ---------- */
function setTab(w){
  [["tabVox","paneVox"],["tabHiggs","paneHiggs"],["tabLib","paneLib"]].forEach(([t,p])=>{
    $(t).classList.toggle("active",w===p); $(p).classList.toggle("active",w===p);
  });
  if(w==="paneHiggs") pollModels();
}
$("tabVox").onclick=()=>setTab("paneVox");
$("tabHiggs").onclick=()=>setTab("paneHiggs");
$("tabLib").onclick=()=>setTab("paneLib");

/* ---------- Audio ---------- */
function getCtx(sr){
  if(!ctx||ctx.sampleRate!==sr){ctx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:sr});nextT=0;}
  if(ctx.state==="suspended")ctx.resume();
  return ctx;
}
function playPCM16(ab,sr){
  const n=Math.floor(ab.byteLength/2); if(n<=0)return;
  const i16=new Int16Array(ab.buffer, ab.byteOffset, n), f32=new Float32Array(n);
  for(let i=0;i<n;i++) f32[i]=i16[i]/32768;
  const c=getCtx(sr), now=c.currentTime;
  if(nextT<now+0.12)nextT=now+0.12;
  const b=c.createBuffer(1,f32.length,c.sampleRate); b.copyToChannel(f32,0);
  const s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(nextT);
  nextT+=f32.length/c.sampleRate;
}
function buildWav(parts,sr){
  let total=0; parts.forEach(a=>total+=Math.floor(a.byteLength/2));
  const pcm=new Int16Array(total); let off=0;
  parts.forEach(ab=>{const n=Math.floor(ab.byteLength/2);pcm.set(new Int16Array(ab.buffer, ab.byteOffset, n),off);off+=n;});
  const buf=new ArrayBuffer(44+pcm.length*2),dv=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,"RIFF");dv.setUint32(4,36+pcm.length*2,true);ws(8,"WAVE");
  ws(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);
  ws(36,"data");dv.setUint32(40,pcm.length*2,true);
  for(let i=0;i<pcm.length;i++)dv.setInt16(44+i*2,pcm[i],true);
  return new Blob([buf],{type:"audio/wav"});
}
function triggerDownload(blob,name){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
}
async function convertDownload(wavBlob,base,fmt){
  const fd=new FormData(); fd.append("file",wavBlob,"audio.wav"); fd.append("to_format",fmt);
  const r=await fetch("/api/convert",{method:"POST",body:fd});
  if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m;}catch(e){}throw new Error(m);}
  triggerDownload(await r.blob(), base+"."+fmt);
}

/* ---------- Generate & play / Generate only Dropdown ---------- */
const genMenu=$("genMenu");
$("genCaret").onclick=(e)=>{e.stopPropagation();genMenu.style.display=genMenu.style.display==="none"?"block":"none";};
document.addEventListener("click",()=>{genMenu.style.display="none";});
$("optPlay").onclick=()=>{genMode="play";updateGenBtn();genMenu.style.display="none";};
$("optOnly").onclick=()=>{genMode="only";updateGenBtn();genMenu.style.display="none";};
function updateGenBtn(){
  $("genBtn").textContent=tr(genMode==="play"?"gen_play":"gen_only_opt");
  $("optPlay").classList.toggle("on",genMode==="play");
  $("optOnly").classList.toggle("on",genMode==="only");
}
/* Higgs eigener Modus (Generate & play / only) */
let hgGenMode="play";
$("hgGenCaret").onclick=(e)=>{e.stopPropagation();$("hgGenMenu").style.display=$("hgGenMenu").style.display==="none"?"block":"none";};
document.addEventListener("click",()=>{$("hgGenMenu").style.display="none";});
$("hgOptPlay").onclick=()=>{hgGenMode="play";updateHgGenBtn();$("hgGenMenu").style.display="none";};
$("hgOptOnly").onclick=()=>{hgGenMode="only";updateHgGenBtn();$("hgGenMenu").style.display="none";};
function updateHgGenBtn(){
  $("hgGenBtn").textContent=tr(hgGenMode==="play"?"gen_play":"gen_only_opt");
  $("hgOptPlay").classList.toggle("on",hgGenMode==="play");
  $("hgOptOnly").classList.toggle("on",hgGenMode==="only");
}

/* ---------- Modell-Status (VoxCPM2 + Higgs) ---------- */
let voxLoaded=false, hgLoaded=false;
function setHgStatus(state){
  const el=$("hgStatus"),dot=$("hgDot");
  el.classList.remove("on");
  if(state==="active"){el.classList.add("on");$("hgStatusTxt").textContent=tr("mdl_loaded_higgs");el.title=tr("unload");}
  else if(state==="loading"){$("hgStatusTxt").textContent=tr("hg_loading");el.title="";}
  else if(state==="disabled"){$("hgStatusTxt").textContent=tr("hg_disabled");el.title="";}
  else{$("hgStatusTxt").textContent=tr("mdl_idle_higgs");el.title=tr("load");}
}
function setVoxStatus(){
  const el=$("voxStatus");
  el.classList.toggle("on",voxLoaded);
  $("voxStatusTxt").textContent=voxLoaded?tr("mdl_loaded_vox"):tr("mdl_idle_vox");
  el.title=voxLoaded?tr("unload"):tr("load");
}
async function pollModels(){
  try{
    const j=await(await fetch("/api/models")).json();
    voxLoaded=!!j.vox_loaded; hgLoaded=!!j.higgs_loaded;
    setVoxStatus(); setHgStatus(hgLoaded?"active":"idle");
  }catch(e){ setVoxStatus(); setHgStatus("idle"); }
}
$("voxStatus").onclick=async()=>{
  try{
    if(voxLoaded){ await fetch("/api/models/vox/unload",{method:"POST"}); }
    else { await fetch("/api/models/vox/load",{method:"POST"}); }
    pollModels();
  }catch(e){rstatus("voxResultMsg",tr("error",{msg:e.message}),false);}
};
$("hgStatus").onclick=async()=>{
  if(!CFG.higgs_enabled)return;
  try{
    if(hgLoaded){ await fetch("/api/models/higgs/unload",{method:"POST"}); }
    else { setHgStatus("loading"); await fetch("/api/models/higgs/load",{method:"POST"}); }
    pollModels();
  }catch(e){rstatus("hgResultMsg",tr("error",{msg:e.message}),false);pollModels();}
};

/* ---------- VOXCPM2 ---------- */
let voicesVox={system:[],custom:[],details:{}};
async function loadVox(){
  try{
    const j=await(await fetch("/voices")).json();
    voicesVox={system:j.system_voices||[],custom:j.custom_voices||[],details:j.custom_voice_details||{}};
    const sel=$("voiceSel"),cur=sel.value; sel.innerHTML="";
    [...voicesVox.custom,...voicesVox.system].forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;sel.appendChild(o);});
    if(cur&&[...voicesVox.custom,...voicesVox.system].includes(cur))sel.value=cur;
  }catch(e){rstatus("libMsg",tr("error",{msg:e.message}),false);}
}
function voxModeChanged(){
  const m=$("voxMode").value;
  $("voiceRow").style.display=(m==="design")?"none":"block";
  const isHigh=(m==="high");
  $("desc").disabled=isHigh; $("desc").style.opacity=isHigh?0.4:1;
  $("desc").placeholder=isHigh?(CFG.lang==="en"?"(not available in High similarity mode)":"(im High-similarity-Modus nicht verfügbar)")
    :"A warm, calm male voice, slightly smiling, medium pace";
}
$("voxMode").onchange=voxModeChanged; voxModeChanged();
function voxPayload(){
  const m=$("voxMode").value, p={model:"voxcpm2",input:$("text").value,response_format:"wav",
    max_length:2048,cfg_value:+$("cfg").value,inference_timesteps:+$("steps").value};
  const seed=$("seed").value.trim(); if(seed!=="")p.seed=+seed;
  if(m==="design"){ p.control_instruction=$("desc").value; }
  else if(m==="ref"){ p.voice=$("voiceSel").value; p.voice_mode="reference"; p.control_instruction=$("desc").value; }
  else { p.voice=$("voiceSel").value; p.voice_mode="high_similarity"; }
  return p;
}
$("genBtn").onclick=async()=>{
  if(!$("text").value.trim()){rstatus("voxResultMsg",tr("enter_text"),false);return;}
  const m=$("voxMode").value;
  if(m!=="design"&&!$("voiceSel").value){rstatus("voxResultMsg",tr("choose_voice"),false);return;}
  const btn=$("genBtn"); btn.disabled=true;
  vox={parts:[],rate:48000,wav:null,cachedText:$("text").value};
  $("voxPlayer").src=""; $("voxDl").disabled=true; $("saveGenBtn").disabled=true;
  rstatus("voxResultMsg",""); showDots("voxDots"); const t0=performance.now(); let ttfb=null;
  abortCtrl=new AbortController();
  try{
    // generate only: nicht-streamende WAV abrufen; generate & play: streamen
    const url = genMode==="only" ? "/v1/audio/speech" : "/v1/audio/speech/stream";
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(voxPayload()),signal:abortCtrl.signal});
    if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m;}catch(e){}throw new Error(m);}
    const sr=Number(r.headers.get("X-Sample-Rate"))||48000; vox.rate=sr;
    if(genMode==="only"){
      const ab=await r.arrayBuffer();
      vox.wav=new Blob([ab],{type:"audio/wav"});
      vox.parts=[ab];
      $("voxPlayer").src=URL.createObjectURL(vox.wav);
      $("voxDl").disabled=false; $("saveGenBtn").disabled=false;
      rstatus("voxResultMsg",tr("gen_only_done",{s:Math.round(ab.byteLength/2/sr)}));
    } else {
      const rd=r.body.getReader();
      while(true){const{done,value}=await rd.read();if(done)break;
        if(value&&value.byteLength){if(ttfb===null){ttfb=Math.round(performance.now()-t0);rstatus("voxResultMsg",tr("gen_ttfb",{ms:ttfb}));}playPCM16(value,sr);vox.parts.push(value);}}
      if(vox.parts.length){ vox.wav=buildWav(vox.parts,sr);
        $("voxPlayer").src=URL.createObjectURL(vox.wav);
        $("voxDl").disabled=false; $("saveGenBtn").disabled=false;
        rstatus("voxResultMsg",tr("gen_done",{s:Math.round(vox.parts.reduce((s,a)=>s+a.byteLength,0)/2/sr),ms:ttfb}));
      } else rstatus("voxResultMsg",tr("no_audio"),false);
    }
  }catch(e){if(e.name!=="AbortError")rstatus("voxResultMsg",tr("error",{msg:e.message}),false);else rstatus("voxResultMsg",tr("aborted"));}
  finally{btn.disabled=false;stopDots();}
};
$("stopBtn").onclick=()=>{if(abortCtrl)abortCtrl.abort();};
$("voxDl").onclick=async()=>{
  if(!vox.wav)return; const fmt=$("voxFmt").value;
  try{ if(fmt==="wav")triggerDownload(vox.wav,"voice.wav"); else await convertDownload(vox.wav,"voice",fmt); rstatus("voxResultMsg",tr("dl_start")); }
  catch(e){rstatus("voxResultMsg",tr("download_err",{msg:e.message}),false);}
};
$("saveGenBtn").onclick=async()=>{
  if(!vox.wav){rstatus("voxResultMsg",tr("error",{msg:"no wav"}),false);return;}
  const name=prompt(CFG.lang==="en"?"Voice name:":"Name der Stimme:"); if(!name||!name.trim())return;
  const fd=new FormData();
  fd.append("voice_name",name.trim()); fd.append("prompt_text",vox.cachedText); fd.append("file",vox.wav,name+".wav");
  try{const r=await fetch("/v1/voices/upload",{method:"POST",body:fd});const j=await r.json();
    if(!r.ok)throw new Error(j.detail||r.statusText);
    rstatus("libMsg",tr("saved",{name,mode:j.mode})); loadVox(); loadHg(); loadLib();
  }catch(e){rstatus("libMsg",tr("error",{msg:e.message}),false);}
};

/* ---------- HIGGS ---------- */
const HIGHS_TAGS=[
  ["Emotion",["elation","amusement","enthusiasm","determination","pride","contentment","affection","relief","contemplation","confusion","surprise","awe","longing","arousal","anger","fear","disgust","bitterness","sadness","shame","helplessness"],"emotion"],
  ["Stil",["singing","shouting","whispering"],"style"],
  ["Prosodie",["speed_very_slow","speed_slow","speed_fast","speed_very_fast","pause","long_pause","pitch_low","pitch_high","expressive_high","expressive_low"],"prosody"],
  ["Sound-Effekte",["cough","laughter","crying","screaming","burping","humming","sigh","sniff","sneeze"],"sfx"],
];
(function buildTags(){
  const bar=$("hgTags"); bar.innerHTML="";
  HIGHS_TAGS.forEach(([cat,vals,type])=>{
    bar.insertAdjacentHTML("beforeend",'<span class="cat">'+cat+'</span>');
    vals.forEach(v=>{
      const b=document.createElement("button"); b.textContent=v; b.title="<|"+type+":"+v+"|>";
      b.onclick=()=>insertTag("<|"+type+":"+v+"|>");
      bar.appendChild(b);
    });
  });
})();
function insertTag(tok){
  const ta=$("hgText"), s=ta.selectionStart, e=ta.selectionEnd;
  ta.value=ta.value.slice(0,s)+tok+ta.value.slice(e);
  ta.focus(); ta.selectionStart=ta.selectionEnd=s+tok.length;
}
let voicesHg=[];
async function loadHg(){
  try{const j=await(await fetch(HIGGS_URL+"/api/voices")).json();
    voicesHg=j.voices||[];
    const sel=$("hgVoice"),cur=sel.value; sel.innerHTML="";
    voicesHg.forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;sel.appendChild(o);});
    if(cur&&voicesHg.includes(cur))sel.value=cur;
  }catch(e){}
}
async function ensureHiggs(){
  if(!CFG.higgs_enabled)return false;
  if(!hgLoaded){
    setHgStatus("loading");
    try{await fetch("/api/models/higgs/load",{method:"POST"});}catch(e){}
    // warten bis Higgs-Modell geladen ist
    for(let i=0;i<60;i++){ await new Promise(r=>setTimeout(r,1000));
      try{const j=await(await fetch(HIGGS_URL+"/health")).json(); if(j.status==="healthy"&&j.model_loaded){hgLoaded=true;setHgStatus("active");return true;} }catch(e){}
      try{const m=await(await fetch("/api/models")).json(); if(m.higgs_loaded){hgLoaded=true;setHgStatus("active");return true;} }catch(e){}
    }
    setHgStatus("idle"); return false;
  }
  return true;
}
$("hgGenBtn").onclick=async()=>{
  if(!$("hgText").value.trim()){rstatus("hgResultMsg",tr("enter_text"),false);return;}
  const v=$("hgVoice").value; if(!v){rstatus("hgResultMsg",tr("choose_voice"),false);return;}
  const btn=$("hgGenBtn"); btn.disabled=true;
  rstatus("hgResultMsg",tr("higgs_auto"));
  showDots("hgDots");
  if(!(await ensureHiggs())){rstatus("hgResultMsg",tr("higgs_down"),false);btn.disabled=false;stopDots();return;}
  hg={parts:[],rate:24000,wav:null};
  $("hgPlayer").src=""; $("hgDl").disabled=true;
  const t0=performance.now(); let ttfb=null;
  abortCtrl=new AbortController();
  const p={voice:v,text:$("hgText").value,temperature:+$("hgTemp").value,seam_frames:+$("hgSeam").value};
  const seed=$("hgSeed").value.trim(); if(seed!=="")p.seed=+seed;
  try{
    const url = hgGenMode==="only" ? "/api/synthesize" : "/api/synthesize/stream";
    const r=await fetch(HIGGS_URL+url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p),signal:abortCtrl.signal});
    if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m;}catch(e){}throw new Error(m);}
    const sr=Number(r.headers.get("X-Sample-Rate"))||24000; hg.rate=sr;
    if(hgGenMode==="only"){
      const ab=await r.arrayBuffer();
      hg.wav=new Blob([ab],{type:"audio/wav"}); hg.parts=[ab];
      $("hgPlayer").src=URL.createObjectURL(hg.wav); $("hgDl").disabled=false;
      rstatus("hgResultMsg",tr("gen_only_done",{s:Math.round(ab.byteLength/2/sr)}));
    } else {
      const rd=r.body.getReader();
      while(true){const{done,value}=await rd.read();if(done)break;
        if(value&&value.byteLength){if(ttfb===null){ttfb=Math.round(performance.now()-t0);rstatus("hgResultMsg",tr("gen_ttfb",{ms:ttfb}));}playPCM16(value,sr);hg.parts.push(value);}}
      if(hg.parts.length){ hg.wav=buildWav(hg.parts,sr);
        $("hgPlayer").src=URL.createObjectURL(hg.wav); $("hgDl").disabled=false;
        rstatus("hgResultMsg",tr("gen_done",{s:Math.round(hg.parts.reduce((s,a)=>s+a.byteLength,0)/2/sr),ms:ttfb}));
      } else rstatus("hgResultMsg",tr("no_audio"),false);
    }
  }catch(e){if(e.name!=="AbortError")rstatus("hgResultMsg",tr("error",{msg:e.message}),false);else rstatus("hgResultMsg",tr("aborted"));}
  finally{btn.disabled=false;stopDots();}
};
$("hgStopBtn").onclick=()=>{if(abortCtrl)abortCtrl.abort();};
$("hgDl").onclick=async()=>{
  if(!hg.wav)return; const fmt=$("hgFmt").value;
  try{ if(fmt==="wav")triggerDownload(hg.wav,"voice.wav"); else await convertDownload(hg.wav,"voice",fmt); rstatus("hgResultMsg",tr("dl_start")); }
  catch(e){rstatus("hgResultMsg",tr("download_err",{msg:e.message}),false);}
};

/* ---------- STIMMEN-BIBLIOTHEK ---------- */
async function testVoice(name){
  // High-similarity fuer moeglichst akkurate Wiedergabe (falls Reftext vorhanden)
  const hasRef = voicesVox.details && !!voicesVox.details[name];
  const mode = hasRef ? "high_similarity" : "reference";
  const p={model:"voxcpm2",input:$("testSentence").value||"Hallo.",voice:name,voice_mode:mode,response_format:"wav"};
  rstatus("libMsg",tr("testing",{name}));
  try{
    const r=await fetch("/v1/audio/speech/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
    if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m;}catch(e){}throw new Error(m);}
    const sr=Number(r.headers.get("X-Sample-Rate"))||48000;
    const rd=r.body.getReader();
    while(true){const{done,value}=await rd.read();if(done)break; if(value&&value.byteLength)playPCM16(value,sr);}
    rstatus("libMsg",tr("test_play"));
  }catch(e){rstatus("libMsg",tr("error",{msg:e.message}),false);}
}
async function loadLib(){
  try{
    // Sicherstellen, dass voicesHg (Higgs-Verfuegbarkeit) geladen ist
    if(!voicesHg.length){ try{ await loadHg(); }catch(e){} }
    const j=await(await fetch("/voices")).json();
    const sys=j.system_voices||[], cus=j.custom_voices||[];
    const det=j.custom_voice_details||{}, desc=j.custom_voice_descriptions||{};
    const el=$("libList");
    if(!sys.length&&!cus.length){el.innerHTML='<p class="hint">'+(CFG.lang==="en"?"No voices yet.":"Keine Stimmen vorhanden.")+'</p>';return;}
    el.innerHTML="";
    // Custom-Stimmen zuerst, dann Systemstimmen
    cus.forEach(n=>{
      const d=document.createElement("div"); d.className="voice";
      d.style.display="block"; d.style.padding=".5rem .4rem";
      // Higgs-Verfuegbarkeit: hat die Stimme eine .wav? (in voicesHg aus /higgs/api/voices)
      const hasHiggs = (voicesHg||[]).indexOf(n)!==-1;
      const higgsBadge = hasHiggs?"":'<span class="hibadge" title="'+(CFG.lang==="en"?"Not available in Higgs":"Nicht für Higgs verfügbar")+'"><span class="xcircle">✕</span> Higgs</span>';
      const curDesc = esc(desc[n]||"");
      const ref = det[n]?esc(det[n]):"";
      const refRow = ref?'<div class="refrow"><button class="refbtn" onclick="this.nextElementSibling.classList.toggle(\'open\')">'+(CFG.lang==="en"?"Reftext":"Reftext")+' ▾</button>'+
        '<div class="reftxt">'+ref+'</div></div>':"";
      d.innerHTML='<div style="display:flex;align-items:center;gap:.4rem"><strong>'+n+'</strong><span class="tag">Custom</span>'+higgsBadge+'</div>'+
        refRow+
        '<div class="row" style="width:100%"><input type="text" class="libdesc" value="'+curDesc+'" placeholder="'+tr("desc_hint")+'">'+
        '<button class="btn sec" onclick="saveDesc(\''+n+'\',this.previousElementSibling.value)">'+(CFG.lang==="en"?"Save":"Speichern")+'</button>'+
        '<button class="btn sec" onclick="testVoice(\''+n+'\')">'+(CFG.lang==="en"?"Test":"Testen")+'</button>'+
        '<button class="btn danger" onclick="delVoice(\''+n+'\')">'+(CFG.lang==="en"?"Delete":"Löschen")+'</button></div>';
      el.appendChild(d);
    });
    sys.forEach(n=>{
      const d=document.createElement("div"); d.className="voice";
      d.innerHTML='<div><strong>'+n+'</strong> <span class="tag">System</span></div>'+
        '<button class="btn sec" onclick="testVoice(\''+n+'\')">'+(CFG.lang==="en"?"Test":"Testen")+'</button>';
      el.appendChild(d);
    });
  }catch(e){rstatus("libMsg",tr("error",{msg:e.message}),false);}
}
async function saveDesc(name,desc){
  try{
    const r=await fetch("/v1/voices/"+encodeURIComponent(name)+"/description",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({description:desc||""})});
    if(!r.ok)throw new Error((await r.json()).detail||r.statusText);
    rstatus("libMsg",tr("desc_saved",{name}));
  }catch(e){rstatus("libMsg",tr("error",{msg:e.message}),false);}
}
async function delVoice(name){
  if(!confirm(CFG.lang==="en"?("Delete voice '"+name+"'?"):("Stimme '"+name+"' löschen?")))return;
  try{const r=await fetch("/v1/voices/"+encodeURIComponent(name),{method:"DELETE"});
    if(!r.ok)throw new Error((await r.json()).detail||r.statusText);
    rstatus("libMsg",tr("deleted",{name})); loadVox(); loadHg(); loadLib();
  }catch(e){rstatus("libMsg",tr("error",{msg:e.message}),false);}
}
$("libCreateBtn").onclick=async()=>{
  const name=$("libName").value.trim(), file=$("libFile").files[0];
  if(!name||!file){rstatus("libMsg",tr("name_req"),false);return;}
  const fd=new FormData();
  fd.append("voice_name",name); fd.append("prompt_text",$("libReftext").value.trim()); fd.append("file",file);
  try{const r=await fetch("/v1/voices/upload",{method:"POST",body:fd});const j=await r.json();
    if(!r.ok)throw new Error(j.detail||r.statusText);
    rstatus("libMsg",tr("created",{name,mode:j.mode})); loadVox(); loadHg(); loadLib();
  }catch(e){rstatus("libMsg",tr("error",{msg:e.message}),false);}
};

/* ---------- Init ---------- */
async function init(){
  try{
    const c=await(await fetch("/api/config")).json();
    CFG={...CFG,...c}; HIGGS_URL=c.higgs_url||HIGGS_URL;
  }catch(e){}
  $("cfg").value=Number(CFG.cfg_default).toFixed(1); $("steps").value=CFG.steps_default;
  applyI18n(); updateGenBtn(); updateHgGenBtn();
  // Higgs-Tab ausblenden, wenn deaktiviert
  if(!CFG.higgs_enabled){ $("tabHiggs").style.display="none"; $("paneHiggs").classList.remove("active"); setHgStatus("disabled"); }
  setHgStatus(CFG.higgs_enabled?"idle":"disabled");
  loadVox(); loadHg(); loadLib();
  pollModels();
  // periodisch aktualisieren (Idle-Unload sichtbar machen)
  setInterval(pollModels, 10000);
}
init();
</script>
