[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicenook"
version = "0.2.0"
description = "A light voice design / cloning studio for macOS (VoxCPM2 + Higgs v3)"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "coremltools==9.0",
    "numpy>=2",
    "ml-dtypes>=0.5.0",
    "soundfile",
    "soxr>=1.0.0",
    "tokenizers",
    "fastapi",
    "uvicorn",
    "aiofiles",
    "huggingface_hub",
    "sounddevice",
    "tqdm",
    "ftfy>=6.3.1",
    "inflect",
    "wetext",
    "regex",
    "mlx-audio",
]

[project.optional-dependencies]
development = [
    "safetensors>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/wraith11/VoiceNook"
Original = "https://github.com/0seba/VoxCPMANE"

[project.scripts]
voicenook-server = "voicenook.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voicenook"]